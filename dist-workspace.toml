[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). v1 is
# macOS-only (Intel + Apple Silicon); other platforms will land incrementally.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Publish a Homebrew formula to this tap on every release.
tap = "farmisen/homebrew-tap"
# Jobs to run when publishing (in addition to the GitHub Release).
publish-jobs = ["homebrew", "./publish-crates-io"]
