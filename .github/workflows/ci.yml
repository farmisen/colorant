name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to macos-14 (not macos-latest) because the latest tag
        # has been intermittently shipping a runner image where the
        # rustup shim resolves `cargo` to `rustup-init`, breaking
        # `cargo fmt --check` despite `dtolnay/rust-toolchain@stable`
        # reporting success. Bump when GitHub retires macos-14.
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features
