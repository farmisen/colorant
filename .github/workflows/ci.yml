name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The macOS runner ships a Homebrew-installed `cargo` that's actually
      # a rustup-init bootstrap shim — it shadows the real cargo dtolnay
      # installs into ~/.cargo/bin. Forcing our bin to the front of PATH
      # fixes `cargo fmt`/`clippy`/etc. resolving to rustup-init and erroring
      # with "unexpected argument 'fmt' found".
      - name: Prepend ~/.cargo/bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features
