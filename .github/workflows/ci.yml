name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    steps:
      - uses: actions/checkout@v4

      # actions-rust-lang/setup-rust-toolchain is the actively maintained
      # successor to dtolnay/rust-toolchain. On macOS runners, dtolnay's
      # action leaves a stale `~/.cargo/bin/cargo` that's the rustup-init
      # bootstrap shim — running `cargo fmt` then errors with "unexpected
      # argument 'fmt' found". setup-rust-toolchain handles the shim
      # refresh correctly and also wires the rust-cache integration.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features
